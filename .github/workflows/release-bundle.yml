name: Release games bundle

on:
  push:
    tags:
      - "games-v*"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run generate:media
      - run: npm run build:bundle
        env:
          MOTION_LEVELS_GAMES_SOURCE_REVISION: ${{ github.sha }}
      - run: npm run verify:bundle
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/motion-levels-games-${{ github.sha }}.tgz
            dist/motion-levels-games-${{ github.sha }}.tgz.sha256
