name: Release games bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: games-bundle-release
  cancel-in-progress: false

jobs:
  release-policy:
    name: Validate release tag and source
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 5
    outputs:
      source_revision: ${{ steps.source.outputs.source_revision }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source
      - name: Require a strict version tag on the current main commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^games-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          (( BASH_REMATCH[1] >= 2 ))
          git fetch --no-tags origin main
          source_revision="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$source_revision" = "$(git rev-parse origin/main)"
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
      - name: Require platform sync credentials before publishing
        env:
          PLATFORM_SYNC_TOKEN: ${{ secrets.PLATFORM_SYNC_TOKEN }}
        run: |
          test -n "$PLATFORM_SYNC_TOKEN"

  checks:
    name: Release quality gate
    needs: release-policy
    uses: ./.github/workflows/checks.yml

  bundle:
    needs:
      - release-policy
      - checks
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE_REVISION: ${{ needs.release-policy.outputs.source_revision }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - name: Download the bundle produced by the release quality gate
        uses: actions/download-artifact@v8
        with:
          name: motion-levels-games-${{ env.SOURCE_REVISION }}
          path: source/dist
      - name: Verify the downloaded release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="motion-levels-games-${SOURCE_REVISION}.tgz"
          test -f "dist/$archive"
          test -f "dist/$archive.sha256"
          cd dist
          sha256sum --check "$archive.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          overwrite_files: false
          target_commitish: ${{ env.SOURCE_REVISION }}
          files: |
            source/dist/motion-levels-games-${{ env.SOURCE_REVISION }}.tgz
            source/dist/motion-levels-games-${{ env.SOURCE_REVISION }}.tgz.sha256
      - name: Refuse to notify consumers from a stale bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git diff --quiet "$SOURCE_REVISION..origin/main" -- \
              apps/player-display \
              apps/player-menu \
              apps/playground \
              apps/venue-runtime \
              games \
              packages \
              scripts \
              package.json \
              package-lock.json \
              tsconfig.json \
              tsconfig.base.json; then
            echo "A newer main commit changes bundle inputs; its release must update consumers." >&2
            exit 1
          fi
  notify-platform:
    needs:
      - release-policy
      - bundle
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 5
    env:
      SOURCE_REVISION: ${{ needs.release-policy.outputs.source_revision }}
    steps:
      - name: Notify platform of the verified release
        env:
          PLATFORM_SYNC_TOKEN: ${{ secrets.PLATFORM_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLATFORM_SYNC_TOKEN"
          payload="$(jq -n \
            --arg ref "main" \
            --arg release_tag "$GITHUB_REF_NAME" \
            --arg source_revision "$SOURCE_REVISION" \
            '{ref:$ref,inputs:{release_tag:$release_tag,source_revision:$source_revision}}')"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-connrefused \
            --retry-delay 2 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PLATFORM_SYNC_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            https://api.github.com/repos/motionlevels/motion-levels-platform/actions/workflows/sync-games-bundle.yml/dispatches
