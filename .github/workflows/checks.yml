name: Shared checks

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: source

jobs:
  quality:
    name: Lint, manifests, and types
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:games
      - run: npm run validate:characters
      - run: npm run benchmark:agents
      - run: npm run typecheck

  compatibility-tests:
    name: Node 22 compatibility
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run test:all

  coverage-tests:
    name: Node 24 coverage and contracts
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run test:coverage
      - run: npm run test --workspace @motion-levels-games/playground
      - run: npm run test:scaffold

  build-and-playtest:
    name: Production build and deterministic engine playtest
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run playtest

  browser-playtest:
    name: Browser playtest and release bundle in pinned runtime
    # This job measures software-rendered frame timing and generates all media.
    # Running it beside the four CPU-heavy lanes on the same homelab host can
    # starve SwiftShader and turn host contention into a false product failure.
    needs: [quality, compatibility-tests, coverage-tests, build-and-playtest]
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run browser-backed release gate in pinned runtime
        env:
          MOTION_LEVELS_GAMES_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playwright-home"
          docker run --rm --ipc=host \
            --user "$(id -u):$(id -g)" \
            --env HOME=/runner-temp/playwright-home \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --env MOTION_LEVELS_GAMES_SOURCE_REVISION \
            --volume "$GITHUB_WORKSPACE/source:/workspace" \
            --volume "$RUNNER_TEMP:/runner-temp" \
            --workdir /workspace \
            mcr.microsoft.com/playwright:v1.61.1-noble \
            bash -lc 'npm run playtest:browser && npm run generate:media && npm run build:bundle && npm run verify:bundle'
      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: motion-levels-games-${{ github.sha }}
          path: |
            source/dist/bundle
            source/dist/motion-levels-games-${{ github.sha }}.tgz
            source/dist/motion-levels-games-${{ github.sha }}.tgz.sha256
          if-no-files-found: error
          retention-days: 30
