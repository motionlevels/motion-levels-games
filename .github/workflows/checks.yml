name: Shared checks

on:
  workflow_call:
    inputs:
      build_release_bundle:
        description: Assemble the immutable production bundle from pinned assets.
        required: false
        default: false
        type: boolean
    secrets:
      MOTION_LEVELS_ASSETS_TOKEN:
        description: Read-only token for the private motion-levels-assets repository.
        required: false

permissions:
  contents: read

defaults:
  run:
    working-directory: source

jobs:
  quality:
    name: Lint, architecture, manifests, and types
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.node-version
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run content:validate
      - run: npm run lint
      - run: npm run validate:architecture
      - run: npm run validate:games
      - run: npm run validate:characters
      - run: npm run typecheck

  compatibility-tests:
    name: Full test suite
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.node-version
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run content:validate
      - run: npm run test:all
      - run: npm run test:dev:venue

  coverage-tests:
    name: Coverage and playground tests
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.node-version
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test --workspace @motion-levels-games/playground

  build-and-playtest:
    name: Production build and deterministic engine playtest
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.node-version
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run content:validate
      - run: npm run build
      - run: npm run playtest

  browser-playtest:
    name: Browser playtest and optional release bundle
    needs: [quality, compatibility-tests, coverage-tests, build-and-playtest]
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source
      - name: Resolve the pinned assets revision
        id: pinned-assets
        if: inputs.build_release_bundle
        env:
          ASSETS_TOKEN: ${{ secrets.MOTION_LEVELS_ASSETS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASSETS_TOKEN"
          echo "revision=$(git rev-parse HEAD:assets)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned private assets repository
        if: inputs.build_release_bundle
        uses: actions/checkout@v7
        with:
          repository: motionlevels/motion-levels-assets
          ref: ${{ steps.pinned-assets.outputs.revision }}
          path: source/assets
          token: ${{ secrets.MOTION_LEVELS_ASSETS_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.node-version
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - name: Resolve the player-facing release tag
        if: inputs.build_release_bundle
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags
          strict_tag='^games-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          release_tag="$(git tag --points-at HEAD --sort=-v:refname | grep -E "$strict_tag" | head -n 1 || true)"
          if [[ -z "$release_tag" ]]; then
            latest_tag="$(git tag --list 'games-v*' --sort=-v:refname | grep -E "$strict_tag" | head -n 1 || true)"
            if [[ -n "$latest_tag" ]]; then
              git merge-base --is-ancestor "$latest_tag" HEAD
            fi

            change="patch"
            latest_major="${latest_tag#games-v}"
            latest_major="${latest_major%%.*}"
            if [[ -z "$latest_tag" ]] || (( latest_major < 2 )); then
              change="major"
            elif \
                ! git diff --quiet --diff-filter=ADR "$latest_tag..HEAD" -- 'games/*/src/manifest.ts'; then
              change="minor"
            fi
            release_tag="$(node scripts/next-release-tag.ts "${latest_tag:-games-v0.0.0}" "$change")"
          fi

          echo "MOTION_LEVELS_GAMES_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Run browser gate in the pinned Playwright runtime
        env:
          BUILD_RELEASE_BUNDLE: ${{ inputs.build_release_bundle }}
          MOTION_LEVELS_GAMES_SOURCE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playwright-home"
          release_tag_env=()
          if [[ -n "${MOTION_LEVELS_GAMES_RELEASE_TAG:-}" ]]; then
            release_tag_env+=(--env MOTION_LEVELS_GAMES_RELEASE_TAG)
          fi
          docker run --rm --ipc=host \
            --user "$(id -u):$(id -g)" \
            --env HOME=/runner-temp/playwright-home \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --env BUILD_RELEASE_BUNDLE \
            --env MOTION_LEVELS_GAMES_SOURCE_REVISION \
            "${release_tag_env[@]}" \
            --volume "$GITHUB_WORKSPACE/source:/workspace" \
            --volume "$RUNNER_TEMP:/runner-temp" \
            --workdir /workspace \
            mcr.microsoft.com/playwright:v1.61.1-noble \
            bash -lc '
              set -euo pipefail
              npm run test:player-menu
              npm run playtest:browser
              if [[ "$BUILD_RELEASE_BUNDLE" == "true" ]]; then
                npm run build:bundle
                npm run verify:bundle
              fi
            '
      - name: Upload production bundle
        if: inputs.build_release_bundle
        uses: actions/upload-artifact@v7
        with:
          name: motion-levels-games-${{ github.sha }}
          path: |
            source/dist/bundle
            source/dist/motion-levels-games-${{ github.sha }}.tgz
            source/dist/motion-levels-games-${{ github.sha }}.tgz.sha256
          if-no-files-found: error
          retention-days: 30
