name: Shared checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, manifests, and types
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:games
      - run: npm run validate:characters
      - run: npm run benchmark:agents
      - run: npm run typecheck

  compatibility-tests:
    name: Node 22 compatibility
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:all

  coverage-tests:
    name: Node 24 coverage and contracts
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run test:coverage
      - run: npm run test --workspace @motion-levels-games/playground
      - run: npm run test:scaffold

  build-and-playtest:
    name: Production build and deterministic engine playtest
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run playtest
      - run: npm run generate:media
      - run: npm run build:bundle
        env:
          MOTION_LEVELS_GAMES_SOURCE_REVISION: ${{ github.sha }}
      - run: npm run verify:bundle
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: motion-levels-games-${{ github.sha }}
          path: |
            dist/bundle
            dist/motion-levels-games-${{ github.sha }}.tgz
            dist/motion-levels-games-${{ github.sha }}.tgz.sha256
          if-no-files-found: error
          retention-days: 30

  browser-playtest:
    name: Browser playtest in pinned Playwright runtime
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run playtest:browser
