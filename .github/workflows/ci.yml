name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  promote-release:
    name: Promote verified main bundle
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.node-version
      - name: Plan the next immutable release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          output() {
            echo "$1=$2" >> "$GITHUB_OUTPUT"
          }

          release_state() {
            local release_tag="$1"
            local status
            status="$(curl \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$release_tag")"
            case "$status" in
              200) echo present ;;
              404) echo absent ;;
              *)
                echo "Unexpected GitHub release API status for $release_tag: $status" >&2
                return 1
                ;;
            esac
          }

          git fetch origin main --tags
          strict_tag='^games-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          existing_tag="$(git tag --points-at HEAD --sort=-v:refname | grep -E "$strict_tag" | head -n 1 || true)"
          if [[ -n "$existing_tag" ]]; then
            existing_release_state="$(release_state "$existing_tag")"
            if [[ "$existing_release_state" == "present" ]]; then
              echo "$existing_tag is already published; consumer notifications are safe to retry."
              output publish false
              output notify true
              output release_tag "$existing_tag"
              exit 0
            fi

            echo "Retrying the missing or failed release for $existing_tag."
            output publish true
            output notify true
            output create_tag false
            output release_tag "$existing_tag"
            exit 0
          fi

          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "A newer main commit exists; its CI run will publish the bundle."
            output publish false
            output notify false
            exit 0
          fi

          latest_tag="$(git tag --list 'games-v*' --sort=-v:refname | grep -E "$strict_tag" | head -n 1 || true)"
          if [[ -n "$latest_tag" ]]; then
            git merge-base --is-ancestor "$latest_tag" HEAD
          fi

          bundle_paths=(
            apps/player-display
            apps/player-menu
            apps/playground
            apps/venue-runtime
            games
            packages
            scripts
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.base.json
          )
          latest_release_exists=false
          if [[ -n "$latest_tag" ]]; then
            latest_release_state="$(release_state "$latest_tag")"
            if [[ "$latest_release_state" == "present" ]]; then
              latest_release_exists=true
            fi
          fi
          if [[ "$latest_release_exists" == "true" ]] && \
              git diff --quiet "$latest_tag..HEAD" -- "${bundle_paths[@]}"; then
            echo "No bundle inputs changed after $latest_tag."
            output publish false
            output notify false
            exit 0
          fi

          change="patch"
          latest_major="${latest_tag#games-v}"
          latest_major="${latest_major%%.*}"
          if [[ -z "$latest_tag" ]] || (( latest_major < 2 )); then
            change="major"
          elif \
              ! git diff --quiet --diff-filter=ADR "$latest_tag..HEAD" -- 'games/*/src/manifest.ts'; then
            change="minor"
          fi
          release_tag="$(node scripts/next-release-tag.ts "${latest_tag:-games-v0.0.0}" "$change")"
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "Refusing to replace existing tag $release_tag." >&2
            exit 1
          fi

          echo "Publishing $release_tag from $GITHUB_SHA ($change change)."
          output publish true
          output notify true
          output create_tag true
          output release_tag "$release_tag"
      - name: Download the verified production bundle
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: motion-levels-games-${{ github.sha }}
          path: source/dist
      - name: Verify the artifact and publish its immutable tag
        if: steps.release.outputs.publish == 'true'
        env:
          CREATE_TAG: ${{ steps.release.outputs.create_tag }}
          PLATFORM_SYNC_TOKEN: ${{ secrets.PLATFORM_SYNC_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLATFORM_SYNC_TOKEN"
          archive="motion-levels-games-${GITHUB_SHA}.tgz"
          test -f "dist/$archive"
          test -f "dist/$archive.sha256"
          (cd dist && sha256sum --check "$archive.sha256")
          if [[ "$CREATE_TAG" == "true" ]]; then
            git fetch --no-tags origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            git config user.name "Motion Levels"
            git config user.email "noreply@motionlevels.com"
            git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Publish the verified release assets
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          name: ${{ steps.release.outputs.release_tag }}
          overwrite_files: false
          tag_name: ${{ steps.release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            source/dist/motion-levels-games-${{ github.sha }}.tgz
            source/dist/motion-levels-games-${{ github.sha }}.tgz.sha256
      - name: Notify the platform consumer
        if: steps.release.outputs.notify == 'true'
        env:
          PLATFORM_SYNC_TOKEN: ${{ secrets.PLATFORM_SYNC_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLATFORM_SYNC_TOKEN"
          payload="$(jq -n \
            --arg ref "main" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_revision "$GITHUB_SHA" \
            '{ref:$ref,inputs:{release_tag:$release_tag,source_revision:$source_revision}}')"
          dispatch() {
            local repository="$1"
            local token="$2"
            curl --fail-with-body --silent --show-error \
              --retry 3 \
              --retry-connrefused \
              --retry-delay 2 \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $token" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              "$GITHUB_API_URL/repos/$repository/actions/workflows/sync-games-bundle.yml/dispatches"
          }
          dispatch motionlevels/motion-levels-platform "$PLATFORM_SYNC_TOKEN"
