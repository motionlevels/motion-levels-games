name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-playtest:
    name: Build and playtest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate games
        run: npm run validate:games

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test game scaffold
        run: npm run test:scaffold

      - name: Build
        run: npm run build

      - name: Playtest example game
        run: npm run playtest
