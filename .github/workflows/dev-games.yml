name: Dev Games CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  dev-games:
    name: Validate dev games
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure dev includes main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate games
        run: npm run validate:games

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test game scaffold
        run: npm run test:scaffold

      - name: Build
        run: npm run build

      - name: Playtest example game
        run: npm run playtest
