name: Dev Games CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-games-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Ensure dev includes main
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - run: git merge-base --is-ancestor origin/main HEAD

  checks:
    needs: branch-policy
    uses: ./.github/workflows/checks.yml
